name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract app
        run: unzip -o app.zip -d .
      - name: Apply OpenRouter migration
        run: python3 .github/scripts/patch_openrouter.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle --no-daemon -p app assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OnePieceAIWorld-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
